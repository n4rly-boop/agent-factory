# Example line: a reviewer fleet. Copy, edit, `line.sh plan` it, then `line.sh up` it.
# Every key here is read by line.sh; nothing else is. See blueprint-wizard.md.

slug: review                    # mailbox + tmux namespace → ai-review-lead, ai-review-sec, …
work: /abs/path/to/repo/work    # the writable zone. Keep it ABSOLUTE: a relative path is
                                # resolved against the CWD of `line up`, not of this file.

defaults:
  model: sonnet
  delegate: advised             # required | advised | no   (a typo here is fatal, on purpose)
  compact_soft: 200000          # TOKENS. Compact between tasks past this — but only when the
  compact_hard: 500000          # driving session runs `ai sweep` / `ai post` / `ai mail`.

agents:
  lead:
    role: orchestrator          # exactly one station. It is every other station's default
                                # parent. The NAME `orchestrator` is reserved — use the role.
    model: opus
    delegate: required          # a coordinator never writes code; it dispatches and verifies
    brief: |
      Mission: own the review of this branch end to end and produce one verdict.

      Scope: you split the diff across the stations below and merge what comes back.
      You do NOT review code yourself — sec/perf/tests do that.

      Inputs: `git diff main...HEAD`.

      Done: every finding from every station is either confirmed with a concrete failure
      case or dropped, and work/lead.md holds the ranked verdict. Then mail --kind done.

      Quality bar: a finding without a reproducible failure case is not a finding. Never
      pass one through because it sounds plausible.

  sec:
    brief: |
      Mission: find security defects in the diff — authn/authz, injection, secrets,
      unsafe deserialization, path traversal.

      Scope: security only. Performance is perf's, coverage is tests'.

      Inputs: `git diff main...HEAD`.

      Done: every hunk read, findings in work/sec.md, each with file:line and the input
      that triggers it. Then mail --kind done to lead.

      Quality bar: no speculative findings. If you cannot state the attacker's input,
      you do not have a finding.

  perf:
    brief: |
      Mission: find performance regressions in the diff — N+1 queries, work inside loops,
      unbounded reads, sync I/O on a hot path.

      Scope: performance only.

      Inputs: `git diff main...HEAD`.

      Done: findings in work/perf.md, each with the input scale at which it hurts.
      Then mail --kind done to lead.

      Quality bar: state the cost. "This could be slow" is not a finding.

  tests:
    count: 2                    # → tests1, tests2 — same brief, split the work between them
                                # by mail. Replicas that must DIFFER are separate stations.
                                # `count: 1` would rename this station `tests1`, not leave it
                                # `tests` — for a single station, omit count entirely.
    brief: |
      Mission: judge test coverage of the diff and write the missing tests.

      Scope: tests only. Do not refactor the code under test.

      Inputs: `git diff main...HEAD` and the existing test suite.

      Done: each new behaviour in the diff has a test that FAILS without the change,
      the suite is green, and work/<yourname>.md lists what you added and what you
      deliberately did not cover. Then mail --kind done to lead.

      Quality bar: a test that passes against the un-patched code is worse than no test.
      Verify each one fails first.
